<svg xmlns="http://www.w3.org/2000/svg" width="180" height="52" viewBox="0 0 180 52">
  <defs>
    <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7A1207"/>
      <stop offset="50%" style="stop-color:#B81F0A"/>
      <stop offset="100%" style="stop-color:#D62B12"/>
    </linearGradient>
  </defs>
  <!-- NEX block -->
  <rect x="0" y="0" width="72" height="52" rx="6" fill="url(#rg)"/>
  <text x="36" y="38" font-family="Arial Black,sans-serif" font-size="28" font-weight="900" 
        fill="white" text-anchor="middle" letter-spacing="1">NEX</text>
  <!-- T block -->
  <rect x="76" y="4" width="38" height="44" rx="4" fill="#1B1D22" stroke="#2A2D33" stroke-width="1"/>
  <text x="95" y="36" font-family="Arial Black,sans-serif" font-size="28" font-weight="900" 
        fill="white" text-anchor="middle">T</text>
  <!-- RIDES UGANDA text -->
  <text x="122" y="24" font-family="Arial,sans-serif" font-size="8" font-weight="700" 
        fill="#8C939D" letter-spacing="3" text-transform="uppercase">RIDES</text>
  <text x="122" y="36" font-family="Arial,sans-serif" font-size="8" font-weight="700" 
        fill="#8C939D" letter-spacing="3">UGANDA</text>
</svg>